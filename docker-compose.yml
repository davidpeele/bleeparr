services:
  bleeparr:
    build: .
    restart: unless-stopped
    ports:
      - "${BLEEPARR_BIND:-127.0.0.1}:5050:5050"
    environment:
      BLEEPARR_TOKEN: ${BLEEPARR_TOKEN:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
    volumes:
      - ./data:/data
      - ./models:/models
      - ${MEDIA_PATH:-./media}:/media:ro
      - ${OUTPUT_PATH:-./cleaned}:/output
      - ${ORIGINALS_PATH:-./originals}:/originals
    cpus: 2
    mem_limit: 4g
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
